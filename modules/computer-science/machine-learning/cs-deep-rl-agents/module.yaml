slug: "cs-deep-rl-agents"
title: "Deep Reinforcement Learning: DQN, Policy Gradients, and Actor-Critic"
summary: "Comprehensive mathematical foundations and engineering implementations of deep reinforcement learning: Deep Q-Networks (DQN, Double DQN, Dueling, Prioritized Replay), Policy Gradient Theorem, REINFORCE with baselines, Advantage Actor-Critic (A2C), Generalized Advantage Estimation (GAE), Continuous Control (DDPG, TD3), Trust Regions (TRPO, PPO), and Model-Based RL (World Models, Dreamer, MuZero)."
