module_slug: "cs-reinforcement-learning-mdp"
passing_threshold_percent: 75

questions:
  - id: "q-mdp-01"
    target_objective_id: "obj-mdp-1"
    prompt: "What mathematical property states that the conditional probability of future states depends only on the present state and action, independent of past history?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The Markov Property"
        is_correct: true
      - id: "opt-2"
        text: "The Lyapunov Stability Criterion"
        is_correct: false
      - id: "opt-3"
        text: "The Central Limit Theorem"
        is_correct: false
      - id: "opt-4"
        text: "The Fourier Inversion Theorem"
        is_correct: false
    explanation: "The Markov property states that P(S_{t+1} | S_t, A_t, ..., S_0, A_0) = P(S_{t+1} | S_t, A_t)."

  - id: "q-mdp-02"
    target_objective_id: "obj-mdp-2"
    prompt: "In the Bellman Optimality Equation V*(s) = max_a sum_{s'} P(s'|s, a) [r + gamma * V*(s')], what is the mathematical role of discount factor gamma < 1?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "It ensures the Bellman backup operator is a contraction mapping that guarantees convergence to a unique fixed point"
        is_correct: true
      - id: "opt-2"
        text: "It speeds up matrix multiplication"
        is_correct: false
      - id: "opt-3"
        text: "It eliminates negative numbers from reward signals"
        is_correct: false
      - id: "opt-4"
        text: "It guarantees that all states have identical values"
        is_correct: false
    explanation: "By the Banach Fixed-Point Theorem, gamma < 1 makes the Bellman operator a gamma-contraction in infinity norm, ensuring geometric convergence to V*."

  - id: "q-mdp-03"
    target_objective_id: "obj-mdp-3"
    prompt: "In Q-learning with alpha = 0.5 and gamma = 0.9, current Q(s, a) = 4.0. The agent gets reward r = 1.0 and lands in state s' where max_a' Q(s', a') = 10.0. What is the updated Q(s, a)?"
    type: "numerical_calculation"
    numerical_solution:
      value: 7.0
      tolerance: 0.05
      unit: "Q-value"
    explanation: "Target = r + gamma * max Q = 1.0 + 0.9 * 10.0 = 10.0. TD error = 10.0 - 4.0 = 6.0. Q_new = 4.0 + 0.5 * 6.0 = 7.0."
