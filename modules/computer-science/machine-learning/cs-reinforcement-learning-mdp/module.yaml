learning_objectives:
  - id: "obj-mdp-1"
    statement: "Explain the agent-environment interaction loop, the Markov property, and the necessity of discounted cumulative return."
    bloom_level: "understand"
  - id: "obj-mdp-2"
    statement: "Calculate the state values, action values, and discounted infinite-horizon returns for stochastic decision paths."
    bloom_level: "apply"
  - id: "obj-mdp-3"
    statement: "Analyze and decompose the Bellman Optimality Equations for state values V*(s) and action values Q*(s, a)."
    bloom_level: "analyze"
  - id: "obj-mdp-4"
    statement: "Evaluate the convergence of Value Iteration using the Banach Fixed-Point contraction mapping theorem."
    bloom_level: "evaluate"
  - id: "obj-mdp-5"
    statement: "Construct a model-free tabular Q-learning software agent with epsilon-greedy exploration and temporal difference learning."
    bloom_level: "create"

