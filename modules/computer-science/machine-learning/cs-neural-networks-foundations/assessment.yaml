module_slug: "cs-neural-networks-foundations"
passing_threshold_percent: 75

questions:
  - id: "q-nn-01"
    target_objective_id: "obj-nn-1"
    prompt: "Why did Minsky and Papert's 1969 proof about the XOR function trigger the First AI Winter?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "It proved single-layer perceptrons cannot separate non-linearly separable functions"
        is_correct: true
      - id: "opt-2"
        text: "It showed computer hardware could never multiply floating-point numbers"
        is_correct: false
      - id: "opt-3"
        text: "It proved neural networks require infinite training data"
        is_correct: false
      - id: "opt-4"
        text: "It proved gradient descent always diverges to infinity"
        is_correct: false
    explanation: "Minsky and Papert demonstrated that single-layer perceptrons are strictly limited to linear decision boundaries, failing on basic non-linear logic like XOR."

  - id: "q-nn-02"
    target_objective_id: "obj-nn-2"
    prompt: "In backpropagation, how is the weight gradient dL/dW_ij^l computed from the layer error delta_i^l and activation a_j^(l-1)?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "dL/dW_ij^l = delta_i^l * a_j^(l-1)"
        is_correct: true
      - id: "opt-2"
        text: "dL/dW_ij^l = delta_i^l + a_j^(l-1)"
        is_correct: false
      - id: "opt-3"
        text: "dL/dW_ij^l = delta_i^l / a_j^(l-1)"
        is_correct: false
      - id: "opt-4"
        text: "dL/dW_ij^l = (delta_i^l)^2 * a_j^(l-1)"
        is_correct: false
    explanation: "By the multivariable chain rule: dL/dW_ij = (dL/dz_i) * (dz_i/dW_ij) = delta_i * a_j."

  - id: "q-nn-03"
    target_objective_id: "obj-nn-3"
    prompt: "What is the derivative of the ReLU activation function f(z) = max(0, z) for any strictly positive input z > 0?"
    type: "numerical_calculation"
    numerical_solution:
      value: 1.0
      tolerance: 0.01
      unit: "slope"
    explanation: "For z > 0, f(z) = z, whose first derivative df/dz = 1.0."
