learning_objectives:
  - id: "obj-nn-1"
    statement: "Explain the biological inspiration of artificial neurons, linear combinations of inputs, and the mathematical definition of activation functions."
    bloom_level: "understand"
  - id: "obj-nn-2"
    statement: "Calculate the forward propagation outputs of a multi-layer perceptron given input vectors, weight matrices, and bias vectors."
    bloom_level: "apply"
  - id: "obj-nn-3"
    statement: "Analyze and prove algebraically why a single-layer perceptron cannot classify the XOR logic function."
    bloom_level: "analyze"
  - id: "obj-nn-4"
    statement: "Evaluate and derive the backpropagation gradient equations for weights and biases across arbitrary layers using the multivariate calculus chain rule."
    bloom_level: "evaluate"
  - id: "obj-nn-5"
    statement: "Construct a production-grade multi-layer perceptron training pipeline implementing gradient descent with loss computation and numerical stability checks."
    bloom_level: "create"

