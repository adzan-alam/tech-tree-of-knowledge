learning_objectives:
  - id: "obj-prog-1"
    statement: "Explain the concept of program state, variables in hardware memory, and how discrete difference equations model physical systems."
    bloom_level: "understand"
  - id: "obj-prog-2"
    statement: "Calculate discrete state updates across iterative loops using deterministic difference equations."
    bloom_level: "apply"
  - id: "obj-prog-3"
    statement: "Analyze the differences between Array-of-Structures (AoS) and Structure-of-Arrays (SoA) in terms of CPU cache lines and memory bandwidth."
    bloom_level: "analyze"
  - id: "obj-prog-4"
    statement: "Evaluate numerical software traps including floating-point non-associativity, time-drift accumulation, and the simulation spiral of death."
    bloom_level: "evaluate"
  - id: "obj-prog-5"
    statement: "Synthesize a deterministic simulation engine with fixed-timestep accumulator pacing, sub-tick interpolation, and ring-buffer rollback capability."
    bloom_level: "create"

practical_applications:
  - title: "Deterministic 60Hz Physics Tick Loop"
    type: "computational_simulation"
    description: "Build a fixed time-step simulation loop separating rendering framerate from computational physics updates with sub-tick interpolation."
  - title: "High-Performance Data-Oriented Particle System"
    type: "engineering_design"
    description: "Design a Structure-of-Arrays (SoA) particle memory pool to maximize CPU L1 cache line hit rates and enable SIMD auto-vectorization."

