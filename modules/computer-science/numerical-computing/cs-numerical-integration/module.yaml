learning_objectives:
  - id: "obj-num-1"
    statement: "Explain phase space, Liouville's theorem, and why Explicit Euler causes artificial energy explosion in conservative physical systems."
    bloom_level: "understand"
  - id: "obj-num-2"
    statement: "Calculate numerical trajectory updates using Semi-Implicit Euler and prove that its state-transition determinant is identically equal to 1.0."
    bloom_level: "apply"
  - id: "obj-num-3"
    statement: "Analyze the second-order global accuracy, time-reversibility, and shadow Hamiltonian conservation of the Velocity Verlet algorithm."
    bloom_level: "analyze"
  - id: "obj-num-4"
    statement: "Evaluate the stability boundaries of numerical integrators using the Courant-Friedrichs-Lewy (CFL) criterion (omega * dt < 2)."
    bloom_level: "evaluate"
  - id: "obj-num-5"
    statement: "Synthesize a production-grade numerical ODE integrator suite comparing Explicit Euler, Symplectic Euler, Velocity Verlet, and RK4 with real-time energy telemetry."
    bloom_level: "create"

practical_applications:
  - title: "Stable Physics Simulator Core Integrator"
    type: "computational_simulation"
    description: "Implement the Velocity Verlet integrator to simulate a gravitational pendulum or harmonic oscillator without artificial energy explosion."
  - title: "Orbital Guidance Trajectory Prediction"
