module_slug: "cs-numerical-integration"
passing_threshold_percent: 75

questions:
  - id: "q-num-01"
    target_objective_id: "obj-num-1"
    prompt: "Why does Explicit (Forward) Euler cause a simulated mass on a spring to spiral outward into an exponential energy explosion?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The determinant of its state transition matrix is det(M) = 1 + omega^2 * dt^2 > 1, expanding phase-space area and pumping artificial energy on every tick."
        is_correct: true
      - id: "opt-2"
        text: "Explicit Euler uses IEEE-754 32-bit floats which truncate negative signs."
        is_correct: false
      - id: "opt-3"
        text: "Newton's laws are invalid when integrated using forward differences."
        is_correct: false
      - id: "opt-4"
        text: "The spring constant k becomes complex-valued when multiplied by delta t."
        is_correct: false
    explanation: "Because det(M) = 1 + omega^2 * dt^2 > 1, the transformation stretches phase space on every step, violating Liouville's theorem and multiplying total mechanical energy exponentially."

  - id: "q-num-02"
    target_objective_id: "obj-num-2"
    prompt: "For a simple harmonic oscillator with omega = 1 rad/s, what is the determinant of the 2x2 state transition matrix for the Semi-Implicit (Euler-Cromer) method?"
    type: "numerical_calculation"
    numerical_solution:
      value: 1.0
      tolerance: 0.0001
      unit: "scalar"
    explanation: "det(M_SIE) = (1 - omega^2 * dt^2)*(1) - (dt)*(-omega^2 * dt) = 1 - omega^2 * dt^2 + omega^2 * dt^2 = 1.0 exactly."

  - id: "q-num-03"
    target_objective_id: "obj-num-3"
    prompt: "In the Velocity Verlet algorithm, why do the local truncation errors cancel out to produce a second-order global convergence O(dt^2)?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "Adding the forward x(t + dt) and backward x(t - dt) Taylor series causes all odd-power derivative terms (velocity and jerk) to cancel identically."
        is_correct: true
      - id: "opt-2"
        text: "It computes four intermediate force evaluations using Simpson's rule."
        is_correct: false
      - id: "opt-3"
        text: "It restricts integration exclusively to circular orbital paths."
        is_correct: false
      - id: "opt-4"
        text: "The acceleration is integrated backwards in time."
        is_correct: false
    explanation: "x(t+dt) + x(t-dt) = 2x(t) + a(t)*dt^2 + O(dt^4). The odd terms v(t)*dt and b(t)*dt^3 cancel out, upgrading accuracy from first order to second order."

  - id: "q-num-04"
    target_objective_id: "obj-num-4"
    prompt: "A stiff spring-mass system has natural angular frequency omega = 50 rad/s. What is the maximum stable timestep dt_max for Semi-Implicit Euler under the CFL stability limit (omega * dt < 2)?"
    type: "numerical_calculation"
    numerical_solution:
      value: 0.04
      tolerance: 0.001
      unit: "seconds"
    explanation: "dt_max = 2 / omega = 2 / 50 = 0.04 seconds (40 ms)."

  - id: "q-num-05"
    target_objective_id: "obj-num-5"
    prompt: "Why is 2nd-order Velocity Verlet preferred over 4th-order Runge-Kutta (RK4) for multi-year planetary orbital simulations?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "Velocity Verlet is symplectic and conserves a nearby shadow Hamiltonian, locking orbital energy in a bounded envelope, whereas RK4's non-symplectic truncation error causes secular energy drift."
        is_correct: true
      - id: "opt-2"
        text: "RK4 cannot calculate gravitational forces in two dimensions."
        is_correct: false
      - id: "opt-3"
        text: "Velocity Verlet runs on GPU shaders whereas RK4 only runs on main CPU registers."
        is_correct: false
      - id: "opt-4"
        text: "RK4 violates Kepler's Third Law when eccentricity exceeds 0.05."
        is_correct: false
    explanation: "Non-symplectic integrators like RK4 suffer from secular energy dissipation or gain over long horizons. Symplectic integrators preserve phase-space volume, ensuring that orbital semi-major axes remain stable over millions of orbits."
