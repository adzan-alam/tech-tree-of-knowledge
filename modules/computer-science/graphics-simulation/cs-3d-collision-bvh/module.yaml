learning_objectives:
  - id: "obj-bvh-1"
    statement: "Explain the curse of 3D dimensionality in spatial grids and how hierarchical bounding trees reduce query times to logarithmic complexity O(log N)."
    bloom_level: "understand"
  - id: "obj-bvh-2"
    statement: "Calculate ray-AABB intersections using the slab method and Möller-Trumbore ray-triangle intersections using barycentric coordinates."
    bloom_level: "apply"
  - id: "obj-bvh-3"
    statement: "Analyze the 15 candidate separating axes for Oriented Bounding Box (OBB) collisions using the 3D Separating Axis Theorem."
    bloom_level: "analyze"
  - id: "obj-bvh-4"
    statement: "Evaluate tree partition candidates using the Surface Area Heuristic (SAH) cost function to optimize ray traversal efficiency."
    bloom_level: "evaluate"
  - id: "obj-bvh-5"
    statement: "Synthesize a 3D raycasting engine integrating SAH BVH tree construction, slab box pruning, and triangle intersection."
    bloom_level: "create"

practical_applications:
  - title: "Real-Time Ray Tracing and 3D Game Physics"
    type: "computational_simulation"
    description: "Accelerate collision queries against million-triangle 3D environments from O(N) to O(log N) using BVH trees."
  - title: "Autonomous Vehicle LIDAR Point-Cloud Broadphase"
    type: "engineering_design"
    description: "Design an adaptive spatial hierarchy for streaming LIDAR point clouds to detect pedestrian and vehicle obstacles in real time."

