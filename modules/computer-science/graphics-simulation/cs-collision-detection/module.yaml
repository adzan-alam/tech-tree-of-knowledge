learning_objectives:
  - id: "obj-col-1"
    statement: "Explain the distinction between the broad-phase and narrow-phase collision detection pipelines and the O(N^2) pairwise problem."
    bloom_level: "understand"
  - id: "obj-col-2"
    statement: "Calculate circle-circle and circle-AABB intersection geometry including penetration depth and unit contact normal."
    bloom_level: "apply"
  - id: "obj-col-3"
    statement: "Analyze convex polygon collisions using the Separating Axis Theorem (SAT) to identify separating axes and the Minimum Translation Vector."
    bloom_level: "analyze"
  - id: "obj-col-4"
    statement: "Evaluate spatial partitioning techniques including uniform spatial hash grids and continuous collision detection (CCD) for tunneling prevention."
    bloom_level: "evaluate"
  - id: "obj-col-5"
    statement: "Synthesize a complete 2D collision detection and resolution pipeline integrating broadphase hashing, SAT narrowphase, and Baumgarte contact stabilization."
    bloom_level: "create"

practical_applications:
  - title: "Real-time Bouncing Ball Simulator"
    type: "computational_simulation"
    description: "Detect multiple bouncing spheres colliding with floor, walls, and each other without sinking or overlapping using spatial hash acceleration."
  - title: "Robotics Obstacle Avoidance Manifold"
    type: "engineering_design"
    description: "Design an interactive collision avoidance pipeline using the Separating Axis Theorem to generate Minimum Translation Vectors for autonomous navigation."

