learning_objectives:
  - id: "obj-col-1"
    statement: "Explain the distinction between the broad-phase and narrow-phase collision detection pipelines."
    bloom_level: "understand"
  - id: "obj-col-2"
    statement: "Implement circle-circle and circle-line intersection tests and calculate contact penetration depths."
    bloom_level: "apply"
  - id: "obj-col-3"
    statement: "Construct a complete collision resolution pipeline including positional correction (Baumgarte stabilization) and restitution impulses."
    bloom_level: "create"

practical_applications:
  - title: "Real-time Bouncing Ball Simulator"
    type: "computational_simulation"
    description: "Detect multiple bouncing spheres colliding with floor, walls, and each other without sinking or overlapping."

