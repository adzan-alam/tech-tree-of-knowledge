learning_objectives:
  - id: "obj-rb3d-1"
    statement: "Explain the six degrees of freedom of a 3D rigid body and how rotational mass is modeled as a 3x3 inertia tensor matrix."
    bloom_level: "understand"
  - id: "obj-rb3d-2"
    statement: "Calculate the 3x3 inertia tensor matrix for canonical 3D geometric solids and transform it to world coordinates via similarity transform."
    bloom_level: "apply"
  - id: "obj-rb3d-3"
    statement: "Analyze Euler's rotational equations of motion to prove the intermediate principal axis instability (the Dzhanibekov Effect)."
    bloom_level: "analyze"
  - id: "obj-rb3d-4"
    statement: "Evaluate gyroscopic precession rates and off-center impact impulse responses on free-floating rigid bodies."
    bloom_level: "evaluate"
  - id: "obj-rb3d-5"
    statement: "Synthesize a 6-DoF numerical rigid-body simulation engine integrating linear momentum, angular momentum, and quaternion attitude updates."
    bloom_level: "create"

practical_applications:
  - title: "Spacecraft and Drone Attitude Dynamics Simulation"
    type: "computational_simulation"
    description: "Simulate tumbling satellites, gyroscopes, and multi-rotor drones by integrating torque, angular momentum, and quaternion orientations."
  - title: "Robotics 6-DoF Manipulator Inertia Balancing"
    type: "engineering_design"
    description: "Design robotic end-effector mass distributions to minimize off-diagonal inertia products and eliminate motor torque cross-coupling."

