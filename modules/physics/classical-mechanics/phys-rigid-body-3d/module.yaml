learning_objectives:
  - id: "obj-rb3d-1"
    statement: "Calculate the 3x3 inertia tensor matrix for canonical 3D geometric solids and transform it to world coordinates."
    bloom_level: "apply"
  - id: "obj-rb3d-2"
    statement: "Analyze and decompose Euler's rotational equations of motion relating torque to angular acceleration."
    bloom_level: "analyze"
  - id: "obj-rb3d-3"
    statement: "Evaluate and assess the rotational instability of the intermediate principal axis (the Dzhanibekov Effect)."
    bloom_level: "evaluate"

practical_applications:
  - title: "Spacecraft and Drone Attitude Dynamics Simulation"
    type: "computational_simulation"
    description: "Simulate tumbling satellites, gyroscopes, and multi-rotor drones by integrating torque, angular momentum, and quaternion orientations."

