module_slug: "phys-rigid-body-3d"
passing_threshold_percent: 75

questions:
  - id: "q-rb3d-01"
    target_objective_id: "obj-rb3d-1"
    prompt: "A solid sphere has mass M = 10.0 kg and radius R = 2.0 m. What is its moment of inertia I about any diameter passing through its center?"
    type: "numerical_calculation"
    numerical_solution:
      value: 16.0
      tolerance: 0.05
      unit: "kg*m^2"
    explanation: "I = (2/5) * M * R^2 = 0.4 * 10.0 * (2.0)^2 = 4.0 * 4 = 16.0 kg*m^2."

  - id: "q-rb3d-02"
    target_objective_id: "obj-rb3d-2"
    prompt: "In Euler's rotational equations of motion, what causes angular acceleration in a torque-free system with non-identical principal moments of inertia?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "Nonlinear cross-coupling terms (I_j - I_k) * omega_j * omega_k"
        is_correct: true
      - id: "opt-2"
        text: "Linear air friction"
        is_correct: false
      - id: "opt-3"
        text: "Gravitational torque"
        is_correct: false
      - id: "opt-4"
        text: "Loss of total angular momentum"
        is_correct: false
    explanation: "Euler's equations: I_1 * d(omega_1)/dt + (I_3 - I_2) * omega_2 * omega_3 = tau_1. When tau = 0, the cross-coupling gyroscopic term drives angular velocity changes."

  - id: "q-rb3d-03"
    target_objective_id: "obj-rb3d-3"
    prompt: "According to the Tennis Racket Theorem, rotation of an asymmetric rigid body (I1 < I2 < I3) is unstable about which principal axis?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The intermediate principal axis (I2)"
        is_correct: true
      - id: "opt-2"
        text: "The minor principal axis (I1)"
        is_correct: false
      - id: "opt-3"
        text: "The major principal axis (I3)"
        is_correct: false
      - id: "opt-4"
        text: "All three principal axes are equally unstable"
        is_correct: false
    explanation: "Perturbations around the intermediate principal axis (I2) have positive real eigenvalues, causing exponential divergence and periodic 180-degree flipping."
