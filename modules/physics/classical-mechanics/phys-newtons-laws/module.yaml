learning_objectives:
  - id: "obj-newt-1"
    statement: "Explain the concept of inertia and distinguish between inertial and non-inertial reference frames."
    bloom_level: "understand"
  - id: "obj-newt-2"
    statement: "Apply Newton's Second Law as a vector sum (F_net = m*a) to calculate accelerations in multi-force systems."
    bloom_level: "apply"
  - id: "obj-newt-3"
    statement: "Analyze action-reaction pairs using Newton's Third Law to ensure internal forces cancel in coupled systems."
    bloom_level: "analyze"
  - id: "obj-newt-4"
    statement: "Evaluate static and kinetic Coulomb friction thresholds on inclined surfaces and moving contacts."
    bloom_level: "evaluate"
  - id: "obj-newt-5"
    statement: "Construct a 2D force accumulator engine that integrates Newtonian mechanics with inverse mass optimization."
    bloom_level: "create"

practical_applications:
  - title: "2D Force Accumulator in Physics Engines"
    type: "computational_simulation"
    description: "Sum all forces (gravity, spring forces, drag, friction) acting on a body to calculate net acceleration a = F_net / m."
  - title: "Atwood Machine & Elevator Dynamics"
    type: "engineering_design"
    description: "Calculate cable tension and apparent weight in accelerating elevators and multi-body pulley systems."
  - title: "Rocket Thrust & Variable Mass Propulsion"
    type: "computational_simulation"
    description: "Model variable mass systems using Tsiolkovsky rocket equation and momentum conservation."

