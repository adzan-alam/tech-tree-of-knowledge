title: "1D and 2D Kinematics: The Description of Motion"
summary: "A comprehensive first-principles guide to kinematics: from Galileo's Falling Stone Paradox and Apollo 15 lunar vacuum proof (Class 6 level) to the four golden equations of motion, 2D orthogonal independence, parabolic ballistics, quadratic aerodynamic drag, and ballistic targeting engines."
