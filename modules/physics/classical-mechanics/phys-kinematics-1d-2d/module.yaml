learning_objectives:
  - id: "obj-kin-1"
    statement: "Explain the physical distinctions between scalar distance/speed and vector displacement/velocity in one and two dimensions."
    bloom_level: "understand"
  - id: "obj-kin-2"
    statement: "Apply the four constant-acceleration kinematic equations to calculate trajectory variables in one-dimensional motion."
    bloom_level: "apply"
  - id: "obj-kin-3"
    statement: "Analyze two-dimensional projectile motion by decoupling orthogonal horizontal and vertical motions."
    bloom_level: "analyze"
  - id: "obj-kin-4"
    statement: "Evaluate aerodynamic drag forces, terminal velocity, and trajectory distortions in planetary atmospheres."
    bloom_level: "evaluate"
  - id: "obj-kin-5"
    statement: "Construct a discrete numerical projectile trajectory simulation engine with quadratic drag in software."
    bloom_level: "create"

practical_applications:
  - title: "2D Projectile Trajectory Simulation"
    type: "computational_simulation"
    description: "Simulate a projectile launched with angle theta and initial speed v_0, calculating time of flight, peak height, and landing distance."
  - title: "Autonomous Drone Ballistic Interception"
    type: "engineering_design"
    description: "Compute dual ballistic launch angles (direct arc vs high lob arc) to intercept moving aerial targets."
  - title: "Aerodynamic Terminal Velocity Modeling"
    type: "computational_simulation"
    description: "Model quadratic air drag and terminal velocity for sports projectiles and skydiving parachutes."

