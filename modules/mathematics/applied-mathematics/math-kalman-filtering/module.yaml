learning_objectives:
  - id: "obj-kf-1"
    statement: "Explain the geometry of uncertainty via multivariate Gaussian density functions, covariance ellipsoids, spectral decomposition, and Mahalanobis distances."
    bloom_level: "understand"
  - id: "obj-kf-2"
    statement: "Analyze continuous-time state-space models and execute exact discretization via matrix exponentials and Van Loan block matrix integration."
    bloom_level: "analyze"
  - id: "obj-kf-3"
    statement: "Execute the discrete multivariable Kalman filter predict and update cycles utilizing the Joseph stabilized covariance form to preserve positive-definiteness."
    bloom_level: "apply"
  - id: "obj-kf-4"
    statement: "Rigorously derive the optimal multivariable Kalman Gain matrix K from matrix calculus trace minimization and the Orthogonality Principle."
    bloom_level: "evaluate"
  - id: "obj-kf-5"
    statement: "Evaluate state observability and detectability via Kalman rank and PBH tests, and solve the Discrete Algebraic Riccati Equation (DARE) for steady-state covariance."
    bloom_level: "evaluate"
  - id: "obj-kf-6"
    statement: "Implement the Extended Kalman Filter (EKF) with analytical/numerical Jacobians and angle-wrapping, and construct the Unscented Kalman Filter (UKF) with Merwe sigma points."
    bloom_level: "create"
  - id: "obj-kf-7"
    statement: "Architect Error-State Kalman Filters (ESKF) for high-rate IMU strapdown mechanization and execute optimal Rauch-Tung-Striebel (RTS) backward smoothing and Chi-square fault gating."
    bloom_level: "create"

practical_applications:
  - title: "Robotic Odometry and Spacecraft Navigation"
    type: "computational_simulation"
    description: "Fuse high-rate noisy accelerometer/gyroscope readings with low-rate GPS or visual position fixes to track robot pose in real time."
  - title: "Autonomous Drone Flight IMU-Barometer-GPS Sensor Fusion System"
    type: "engineering_design"
    description: "Design multi-rate sensor fusion filters for unmanned aerial vehicles to maintain hover stability despite wind turbulence."
  - title: "Real-Time Visual-Inertial Odometry (VIO)"
    type: "engineering_design"
    description: "Tightly-coupled camera feature tracking fused with high-rate inertial strapdown on mobile robotics platforms."

