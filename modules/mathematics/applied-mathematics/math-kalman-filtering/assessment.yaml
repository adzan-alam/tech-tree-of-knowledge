module_slug: "math-kalman-filtering"
passing_threshold_percent: 75

questions:
  - id: "q-kf-01"
    target_objective_id: "obj-kf-1"
    prompt: "Why does dead-reckoning navigation (such as integrating wheel encoder ticks or accelerometer data) inevitably drift off course over extended operational durations?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "Integrating velocities and accelerations accumulates tiny constant sensor calibration biases and process noise over time: delta x = integral (v_true + bias) dt = x_true + bias * t"
        is_correct: true
      - id: "opt-2"
        text: "Earth's magnetic field randomly inverts encoder pulse polarity"
        is_correct: false
      - id: "opt-3"
        text: "Floating point numbers lose one bit of precision every second"
        is_correct: false
      - id: "opt-4"
        text: "Wheel friction strictly increases to infinity as distance increases"
        is_correct: false
    explanation: "Because integration is a cumulative sum, any non-zero bias error in velocity or acceleration produces an error that grows linearly or quadratically with elapsed time."

  - id: "q-kf-02"
    target_objective_id: "obj-kf-2"
    prompt: "A 1D autonomous vehicle has prior predicted position x_hat = 30.0 meters with variance P = 6.0 m^2. An ultrasonic sensor reports z = 38.0 meters with measurement variance R = 2.0 m^2 (observation matrix H = 1.0). What is the updated posterior position x_hat^+?"
    type: "numerical_calculation"
    numerical_solution:
      value: 36.0
      tolerance: 0.05
      unit: "meters"
    explanation: "Kalman gain K = P / (P + R) = 6.0 / (6.0 + 2.0) = 6.0 / 8.0 = 0.75. Updated position x_hat^+ = 30.0 + 0.75 * (38.0 - 30.0) = 30.0 + 0.75 * 8.0 = 30.0 + 6.0 = 36.0 meters."

  - id: "q-kf-03"
    target_objective_id: "obj-kf-3"
    prompt: "In the mathematical derivation of the optimal Kalman Gain K = P H^T (H P H^T + R)^{-1}, what objective function is minimized by setting its matrix derivative to zero?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The trace of the posterior error covariance matrix Tr(P_{k|k}), which represents the total mean squared estimation error"
        is_correct: true
      - id: "opt-2"
        text: "The determinant of the state transition matrix det(F)"
        is_correct: false
      - id: "opt-3"
        text: "The condition number of the sensor noise matrix R"
        is_correct: false
      - id: "opt-4"
        text: "The Frobenius norm of the control input matrix B"
        is_correct: false
    explanation: "The optimal Kalman gain minimizes the total estimation variance by finding the stationary point where d(Tr(P_{k|k}))/dK = 0."

  - id: "q-kf-04"
    target_objective_id: "obj-kf-4"
    prompt: "What is the limiting behavior of the Kalman Gain K = P H^T (H P H^T + R)^{-1} as the sensor measurement noise variance approaches infinity (R -> infinity)?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "K -> 0, causing the filter to completely ignore the sensor measurement and trust the physics prediction 100%"
        is_correct: true
      - id: "opt-2"
        text: "K -> 1, causing the filter to snap entirely to the sensor measurement"
        is_correct: false
      - id: "opt-3"
        text: "K diverges to infinity and produces NaN values"
        is_correct: false
      - id: "opt-4"
        text: "K oscillates sinusoidally between -1 and +1"
        is_correct: false
    explanation: "As sensor noise R grows infinitely large, the denominator dominates, driving K toward 0. The innovation term K*(z - Hx) vanishes, leaving the filter to rely entirely on dead-reckoning physics."

  - id: "q-kf-05"
    target_objective_id: "obj-kf-5"
    prompt: "A ground radar at origin (0, 0) measures target range rho = sqrt(x^2 + y^2). If the estimated aircraft position is (x, y) = (300 meters, 400 meters), what is the numerical value of the Jacobian entry H_{1,1} = d(rho)/dx = x / sqrt(x^2 + y^2)?"
    type: "numerical_calculation"
    numerical_solution:
      value: 0.6
      tolerance: 0.01
      unit: "dimensionless"
    explanation: "Range rho = sqrt(300^2 + 400^2) = sqrt(90000 + 160000) = sqrt(250000) = 500 meters. Partial derivative d(rho)/dx = x / rho = 300 / 500 = 0.6."
