learning_objectives:
  - id: "obj-prob-1"
    statement: "Explain the distinction between frequentist and Bayesian probability and the Kolmogorov axiomatic foundation."
    bloom_level: "understand"
  - id: "obj-prob-2"
    statement: "Calculate mathematical expectation and variance for discrete and continuous probability distributions."
    bloom_level: "apply"
  - id: "obj-prob-3"
    statement: "Analyze Gaussian normal distributions and apply the Central Limit Theorem to explain measurement noise."
    bloom_level: "analyze"
  - id: "obj-prob-4"
    statement: "Evaluate posterior beliefs using Bayes' Theorem to resolve base-rate fallacies and fuse noisy sensor measurements."
    bloom_level: "evaluate"
  - id: "obj-prob-5"
    statement: "Synthesize a probabilistic simulation engine integrating Box-Muller Gaussian sampling, Bayesian sensor fusion, and Monte Carlo integration."
    bloom_level: "create"

practical_applications:
  - title: "Sensor Noise Modeling and State Estimation"
    type: "computational_simulation"
    description: "Model robotic sensor uncertainty and stochastic environment transitions using Gaussian distributions and Bayesian updates."
  - title: "Autonomous Vehicle Multi-Sensor Fusion"
    type: "engineering_design"
    description: "Design an optimal sensor fusion pipeline using closed-form Gaussian Bayesian updates to combine noisy GPS and wheel odometry readings."

