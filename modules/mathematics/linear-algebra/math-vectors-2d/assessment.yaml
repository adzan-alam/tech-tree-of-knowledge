module_slug: "math-vectors-2d"
passing_threshold_percent: 75

questions:
  - id: "q-vec-01"
    target_objective_id: "obj-vec-1"
    prompt: "A displacement vector has Cartesian coordinates d = (6, -8) meters. What is the Euclidean magnitude ||d||?"
    type: "numerical_calculation"
    numerical_solution:
      value: 10.0
      tolerance: 0.05
      unit: "meters"
    explanation: "By Euclidean norm, ||d|| = sqrt(6^2 + (-8)^2) = sqrt(36 + 64) = sqrt(100) = 10 meters."

  - id: "q-vec-02"
    target_objective_id: "obj-vec-2"
    prompt: "Given vector A = (3, 2) and vector B = (-1, 5), calculate the vector sum C = A + 2B. What is the y-component C_y?"
    type: "numerical_calculation"
    numerical_solution:
      value: 12.0
      tolerance: 0.01
      unit: "scalar"
    explanation: "C = (3 + 2*(-1), 2 + 2*5) = (1, 12). Therefore, C_y = 12."

  - id: "q-vec-03"
    target_objective_id: "obj-vec-3"
    prompt: "If the dot product of two non-zero vectors u and v equals zero (u · v = 0), what is the geometric relationship between them?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The vectors are strictly orthogonal (perpendicular) at 90 degrees."
        is_correct: true
      - id: "opt-2"
        text: "The vectors are collinear pointing in the same direction."
        is_correct: false
      - id: "opt-3"
        text: "The vectors have identical lengths."
        is_correct: false
      - id: "opt-4"
        text: "The vectors are collinear pointing in opposite directions."
        is_correct: false
    explanation: "u · v = ||u|| ||v|| cos(theta). For non-zero vectors, u · v = 0 requires cos(theta) = 0, meaning theta = 90 degrees."
