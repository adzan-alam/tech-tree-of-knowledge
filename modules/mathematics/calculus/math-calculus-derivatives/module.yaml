learning_objectives:
  - id: "obj-calc-1"
    statement: "Explain the formal limit definition of the derivative as the instantaneous rate of change and tangent slope."
    bloom_level: "understand"
  - id: "obj-calc-2"
    statement: "Apply the power rule, product rule, quotient rule, and chain rule to derive analytical derivatives of algebraic and trigonometric functions."
    bloom_level: "apply"
  - id: "obj-calc-3"
    statement: "Analyze kinematic motion hierarchies (position, velocity, acceleration, jerk) to model physical systems."
    bloom_level: "analyze"
  - id: "obj-calc-4"
    statement: "Evaluate critical points, concavity, and extrema to solve real-world optimization problems."
    bloom_level: "evaluate"
  - id: "obj-calc-5"
    statement: "Construct high-precision numerical differentiation algorithms in software while avoiding catastrophic floating-point cancellation."
    bloom_level: "create"

practical_applications:
  - title: "Kinematic State Derivation"
    type: "computational_simulation"
    description: "Analytically derive velocity v(t) = dx/dt and acceleration a(t) = dv/dt to benchmark discrete numerical simulators."
  - title: "Autonomous Drone Trajectory Planning"
    type: "engineering_design"
    description: "Compute jerk (3rd derivative) and snap (4th derivative) to generate smooth minimum-jerk trajectory profiles for quadrotor drones."
  - title: "Numerical Gradient & Newton-Raphson Optimization"
    type: "computational_simulation"
    description: "Implement finite-difference gradients and tangent-line root-finding to solve non-linear physics equilibria and loss function optimization."

