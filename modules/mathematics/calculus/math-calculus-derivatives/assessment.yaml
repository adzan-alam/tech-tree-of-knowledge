module_slug: "math-calculus-derivatives"
passing_threshold_percent: 75

questions:
  - id: "q-calc-01"
    target_objective_id: "obj-calc-1"
    prompt: "Geometrically, what does the derivative f'(a) of a differentiable function f(x) evaluate to at x = a?"
    type: "multiple_choice"
    options:
      - id: "opt-1"
        text: "The exact slope of the tangent line to the curve at the point (a, f(a))."
        is_correct: true
      - id: "opt-2"
        text: "The net area under the curve between 0 and a."
        is_correct: false
      - id: "opt-3"
        text: "The average secant slope over an infinite domain."
        is_correct: false
      - id: "opt-4"
        text: "The curvature radius of the circle of best fit."
        is_correct: false
    explanation: "The derivative by definition evaluates to the limit of secant slopes as dx -> 0, which yields the exact tangent slope at that point."

  - id: "q-calc-02"
    target_objective_id: "obj-calc-2"
    prompt: "Given f(x) = 4x^3 - 5x^2 + 7x - 9, compute f'(2)."
    type: "numerical_calculation"
    numerical_solution:
      value: 35.0
      tolerance: 0.01
      unit: "scalar"
    explanation: "f'(x) = 12x^2 - 10x + 7. At x = 2: f'(2) = 12(4) - 10(2) + 7 = 48 - 20 + 7 = 35."

  - id: "q-calc-03"
    target_objective_id: "obj-calc-3"
    prompt: "A particle moves with position function s(t) = t^4 - 2t^2. What is its acceleration a(t) at t = 2 seconds?"
    type: "numerical_calculation"
    numerical_solution:
      value: 44.0
      tolerance: 0.05
      unit: "m/s^2"
    explanation: "v(t) = s'(t) = 4t^3 - 4t. a(t) = v'(t) = 12t^2 - 4. At t = 2: a(2) = 12(4) - 4 = 48 - 4 = 44 m/s^2."
